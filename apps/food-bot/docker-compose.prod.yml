services:
  db:
    image: postgres:17
    restart: always
    environment:
      # Database is named "bisya", not "food_bot" - it holds every bot's
      # tables plus shared ones (User, Wallet), per CONTEXT.md's table-naming
      # convention. POSTGRES_DB only seeds the DB on first init; the actual
      # live database was renamed in place (food_bot -> bisya) once Music
      # Bot needed to share it. New environments starting from scratch will
      # correctly get "bisya" from this value.
      POSTGRES_DB: bisya
      POSTGRES_USER: food_bot_user
      POSTGRES_PASSWORD: food_bot_password
    networks:
      - food-bot-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    depends_on:
      - db
    image: ghcr.io/feyyus/prod-food-bot:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://food_bot_user:food_bot_password@db:5432/bisya
      # Telegram is blocked on the homelab's network; route API calls
      # through the existing SSH SOCKS5 tunnel to a Finland VPS.
      TELEGRAM_PROXY_HOST: host.docker.internal
      TELEGRAM_PROXY_PORT: "1080"
    networks:
      - food-bot-net
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  food-bot-net:
    name: food-bot-net
    driver: bridge

volumes:
  pgdata:
