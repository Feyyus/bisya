name: Deploy Food Bot

on:
  push:
    branches: ['main']
    paths:
      - 'apps/food-bot/**'
      - 'packages/db/**'
      - 'packages/bot-kit/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-food-bot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_TIMEOUT: 600

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Copy .env to server'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.FOOD_BOT_DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "${{ secrets.FOOD_BOT_DEPLOY_ENV }}" > /srv/deployments/prod-food-bot/.env

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@v1

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: 'Login to GitHub Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 'KhoDis'
          password: ${{ secrets.REGISTRY_KEY }}

      - name: 'Build & Push food-bot Image'
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./apps/food-bot/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/khodis/prod-food-bot:latest

      - name: 'Copy docker-compose.yml to server'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.FOOD_BOT_DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'apps/food-bot/docker-compose.prod.yml'
          target: '/srv/deployments/prod-food-bot/'
          strip_components: 2
          timeout: 300s

      - name: 'Deploy on server'
        uses: appleboy/ssh-action@master
        with:
          timeout: 60m
          command_timeout: 60m
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.FOOD_BOT_DEPLOY_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /srv/deployments/prod-food-bot
            mv docker-compose.prod.yml docker-compose.yml
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
